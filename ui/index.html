    <header id="masthead">
      <div class="mast-start">
        <button class="icon-btn" id="guide-toggle" type="button" aria-label="Guide">
          <svg class="icon"><use href="#i-menu" /></svg>
        </button>
        <a class="brand" href="#/" aria-label="YouTube Home">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          </span>
          <span class="brand-name">YouTube</span>
        </a>
      </div>

      <div class="mast-center">
        <form class="search" id="search-form" role="search">
          <div class="search-box">
            <input
              id="search-input"
              name="q"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search"
              aria-label="Search"
            />
          </div>
          <button class="round-btn" type="submit" aria-label="Search">
            <svg class="icon"><use href="#i-search" /></svg>
          </button>
          <button class="round-btn" type="button" aria-label="Search with your voice">
            <svg class="icon"><use href="#i-mic" /></svg>
          </button>
        </form>
      </div>

      <div class="mast-end">
        <button class="icon-btn" id="bell-button" type="button" aria-label="Notifications">
          <svg class="icon"><use href="#i-bell" /></svg>
        </button>
        <button class="signin-pill" id="signin-button" type="button">Sign in</button>
        <button class="avatar-btn" id="account-button" type="button" aria-label="Account" hidden>
          <img id="account-avatar" alt="" hidden />
          <span id="account-letter">W</span>
        </button>
      </div>
    </header>

    <div id="page">
      <aside id="guide" aria-label="Guide"></aside>
      <main id="content" tabindex="-1"></main>
    </div>

    <script src="player.js"></script>
    <script src="app.js"></script>
