[package]
name = "wintube"
version = "0.2.2"
edition = "2024"
description = "WinTube - a fast, native YouTube desktop client"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls", "stream"] }
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net"] }
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
